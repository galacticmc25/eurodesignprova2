<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preventivatore Rapido - Eurodesign</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Regole per trasformare la pagina in un PDF pulito quando clicchi "Salva PDF" */
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-shadow-none { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">

  <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md print-shadow-none">
    
    <!-- Intestazione Azienda & Numero Preventivo -->
    <div class="flex justify-between items-start border-b pb-6 mb-6">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">EURODESIGN</h1>
        <p class="text-sm text-slate-500 mt-1">Progettazione & Soluzioni su Misura</p>
      </div>
      <div class="text-right">
        <span class="text-xs uppercase font-semibold text-slate-400">Preventivo N.</span>
        <input type="text" id="numeroPreventivo" value="2026/001" class="block text-right font-bold text-lg text-slate-800 border-b border-dashed border-slate-300 focus:outline-none w-32 ml-auto">
        <p class="text-sm text-slate-500 mt-1" id="dataOggi"></p>
      </div>
    </div>

    <!-- Dati Cliente -->
    <div class="mb-8 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Spett.le Cliente</label>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" placeholder="Nome Cliente o Ragione Sociale" class="bg-white border border-slate-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-blue-500">
        <input type="text" placeholder="Indirizzo / Città" class="bg-white border border-slate-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-blue-500">
        <input type="text" placeholder="Email o Telefono" class="bg-white border border-slate-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-blue-500">
        <input type="text" placeholder="Oggetto del preventivo (es. Arredo Ufficio)" class="bg-white border border-slate-300 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <!-- Form Aggiunta Voci (Nascosto nel PDF) -->
    <div class="no-print mb-6 bg-blue-50 p-4 rounded-lg border border-blue-200">
      <h2 class="text-sm font-bold text-blue-900 mb-3">+ Aggiungi Voce al Preventivo</h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
        <input type="text" id="desc" placeholder="Descrizione prodotto o lavorazione..." class="md:col-span-6 bg-white border border-slate-300 rounded px-3 py-2 text-sm">
        <input type="number" id="qta" value="1" min="1" placeholder="Qtà" class="md:col-span-2 bg-white border border-slate-300 rounded px-3 py-2 text-sm">
        <input type="number" id="prezzo" step="0.01" placeholder="Prezzo €" class="md:col-span-2 bg-white border border-slate-300 rounded px-3 py-2 text-sm">
        <button onclick="aggiungiVoce()" class="md:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded px-4 py-2 text-sm transition">
          Aggiungi
        </button>
      </div>
    </div>

    <!-- Tabella Voci -->
    <table class="w-full text-left border-collapse mb-8">
      <thead>
        <tr class="border-b-2 border-slate-300 text-xs uppercase text-slate-500">
          <th class="py-3">Descrizione</th>
          <th class="py-3 text-center w-20">Qtà</th>
          <th class="py-3 text-right w-28">Prezzo Unit.</th>
          <th class="py-3 text-right w-28">Totale</th>
          <th class="py-3 text-center w-12 no-print"></th>
        </tr>
      </thead>
      <tbody id="listaVoci" class="divide-y divide-slate-200 text-sm">
        <!-- Le righe vengono inserite qui da JavaScript -->
      </tbody>
    </table>

    <!-- Totali -->
    <div class="flex justify-end">
      <div class="w-64 space-y-2 text-sm">
        <div class="flex justify-between text-slate-600">
          <span>Imponibile:</span>
          <span id="imponibile">0,00 €</span>
        </div>
        <div class="flex justify-between text-slate-600">
          <span>IVA (22%):</span>
          <span id="iva">0,00 €</span>
        </div>
        <div class="flex justify-between text-lg font-bold text-slate-900 border-t-2 border-slate-800 pt-2">
          <span>TOTALE:</span>
          <span id="totale">0,00 €</span>
        </div>
      </div>
    </div>

    <!-- Note e Pulsante Stampa/PDF -->
    <div class="mt-10 pt-6 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-xs text-slate-400">Validità preventivo: 30 giorni. Tempi di consegna da concordare.</p>
      <button onclick="window.print()" class="no-print bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-3 rounded-lg shadow transition flex items-center gap-2">
        <span>📄 Esporta in PDF / Stampa</span>
      </button>
    </div>

  </div>

  <script>
    // Imposta data odierna
    document.getElementById('dataOggi').innerText = new Date().toLocaleDateString('it-IT');

    let voci = [
      { desc: "Consulenza e rilievo misure in loco", qta: 1, prezzo: 150.00 }
    ];

    function formattaEuro(num) {
      return num.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function aggiornaTabella() {
      const tbody = document.getElementById('listaVoci');
      tbody.innerHTML = '';
      let imponibile = 0;

      voci.forEach((voce, index) => {
        const subtotale = voce.qta * voce.prezzo;
        imponibile += subtotale;

        tbody.innerHTML += `
          <tr>
            <td class="py-3 font-medium">${voce.desc}</td>
            <td class="py-3 text-center">${voce.qta}</td>
            <td class="py-3 text-right">${formattaEuro(voce.prezzo)}</td>
            <td class="py-3 text-right font-semibold">${formattaEuro(subtotale)}</td>
            <td class="py-3 text-center no-print">
              <button onclick="rimuoviVoce(${index})" class="text-red-500 hover:text-red-700 font-bold">✕</button>
            </td>
          </tr>
        `;
      });

      const iva = imponibile * 0.22;
      const totale = imponibile + iva;

      document.getElementById('imponibile').innerText = formattaEuro(imponibile);
      document.getElementById('iva').innerText = formattaEuro(iva);
      document.getElementById('totale').innerText = formattaEuro(totale);
    }

    function aggiungiVoce() {
      const desc = document.getElementById('desc').value.trim();
      const qta = parseFloat(document.getElementById('qta').value);
      const prezzo = parseFloat(document.getElementById('prezzo').value);

      if (!desc || isNaN(qta) || isNaN(prezzo)) {
        alert("Inserisci descrizione, quantità e prezzo validi!");
        return;
      }

      voci.push({ desc, qta, prezzo });
      document.getElementById('desc').value = '';
      document.getElementById('prezzo').value = '';
      aggiornaTabella();
    }

    function rimuoviVoce(index) {
      voci.splice(index, 1);
      aggiornaTabella();
    }

    // Carica la voce di esempio all'avvio
    aggiornaTabella();
  </script>
</body>
</html>
